# AWS Amplify Hosting — HireOps (Next.js SSR / WEB_COMPUTE)
# Docs: https://docs.aws.amazon.com/amplify/latest/userguide/deploy-nextjs-app.html
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        - rm -f .env.production
        - env | grep -E '^(AI_PROVIDER|AI_CHAT_MODEL|AI_EMBEDDING_MODEL|OPENROUTER_API_KEY|APP_ENCRYPTION_KEY|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|NEXT_PUBLIC_APP_URL)$' >> .env.production || true
        - node scripts/verify-production-env.mjs || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
